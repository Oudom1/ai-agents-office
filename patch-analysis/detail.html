<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patch Impact Review</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#16191f;background:#f5f6f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #ddd;padding:20px max(22px,calc((100vw - 1220px)/2))}main{max-width:1220px;margin:auto;padding:26px 20px}a{color:#184fc2}button,.btn{background:#111;color:white;border:1px solid #111;border-radius:9px;padding:11px 16px;text-decoration:none;cursor:pointer;display:inline-block;font-weight:650}button:hover,.btn:hover{background:#343434}h1{margin:15px 0 8px;font-size:29px;overflow-wrap:anywhere}h2{font-size:19px;margin:0 0 14px}.subtitle{color:#566476;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #e1e5eb;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000007}.stat b{display:block;font-size:12px;color:#64748b;margin-bottom:8px}.stat span{font-size:16px;font-weight:650;overflow-wrap:anywhere}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#657588;font-weight:700}.note{padding:13px;border-left:3px solid #222;background:#f5f6f8;margin:14px 0;line-height:1.6}.resources a{display:block;border:1px solid #e2e5ea;padding:14px;margin:9px 0;border-radius:9px;text-decoration:none;font-weight:600}.resources a:hover{background:#f4f6f8}.small{font-size:13px;color:#536272;line-height:1.65}.chip{padding:6px 10px;border-radius:22px;background:#eaecef;font-size:12px;font-weight:700;display:inline-block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#687789}@media(max-width:800px){.cols{grid-template-columns:1fr}} </style></head><body>
<header><div class="row"><a href="./index.html" class="btn">← Back to all patches</a><strong>Patch & CVE Analysis Portal</strong></div></header>
<main id="main"><p>Loading vulnerability record...</p></main><script>
(()=>{"use strict";const key="patch_analysis_flexible_v2",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const q=new URLSearchParams(location.search);let data=[];try{data=JSON.parse((q.get("preview")==="1"?sessionStorage.getItem("patch_analysis_preview_v2"):localStorage.getItem(key))||"[]")}catch(e){}const i=Number(q.get("id"));const r=Number.isSafeInteger(i)&&i>=0&&Array.isArray(data)?data[i]:null;const root=document.getElementById("main");if(!r){root.innerHTML="<div class='card'><h1>Patch record not found</h1><p>Open a vulnerability from the main portal. Preview records may expire when the browser tab is closed.</p><a href='./index.html' class='btn'>Return to portal</a></div>";return}const cves=[...new Set(([r.cve,r.threat,r.patch].join(" ").match(/CVE-\d{4}-\d{4,}/gi)||[]).map(s=>s.toUpperCase()))];const kbs=[...new Set(([r.patch,r.threat].join(" ").match(/KB\d{4,}/gi)||[]).map(s=>s.toUpperCase()))];let links=[];for(const c of cves){links.push(["NIST NVD vulnerability record · "+c,"https://nvd.nist.gov/vuln/detail/"+encodeURIComponent(c),"Official vulnerability description, severity scoring, affected versions and references when available"]);links.push(["CVE Program record · "+c,"https://www.cve.org/CVERecord?id="+encodeURIComponent(c),"Vulnerability identifier and published references"])}for(const k of kbs){links.push(["Microsoft Update Catalog · "+k,"https://www.catalog.update.microsoft.com/Search.aspx?q="+encodeURIComponent(k),"Look up applicable updates and supported products"]);links.push(["Microsoft Support · "+k,"https://support.microsoft.com/search/results?query="+encodeURIComponent(k),"Look for release notes, prerequisites and known issues"])}if(/^https:\/\//i.test(r.url))links.unshift(["Advisory in imported report",r.url,"Source provided in report"]);links.push(["CISA Known Exploited Vulnerabilities Catalog","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","Check whether the CVE is listed as known exploited (not automatically verified here)"]);links.push(["Search exact vulnerability and compatibility notes","https://www.google.com/search?q="+encodeURIComponent([r.cve,r.patch,r.threat,"vendor advisory known issues workaround reboot compatibility"].filter(Boolean).join(" ")),"Find additional product-specific research; validate source credibility"]);const stat=(k,v)=>"<div class='card stat'><b>"+esc(k)+"</b><span>"+esc(v)+"</span></div>";const section=(heading,text)=>"<div class='card'><h2>"+esc(heading)+"</h2><p class='small'>"+esc(text)+"</p></div>";const title=r.cve||r.patch||r.threat;root.innerHTML="<div class='row'><span class='chip'>"+esc(r.priority==="Review"?"Needs severity triage":r.priority)+"</span><span class='chip'>"+esc(r.category)+"</span>"+(q.get("preview")==="1"?"<span class='chip'>Unsaved preview</span>":"")+"</div><h1>"+esc(title)+"</h1><p class='subtitle'>"+esc(r.threat||r.product||"Vulnerability record")+"</p><div class='grid'>"+stat("Affected system count",r.affected??"Unknown")+stat("Exploit evidence in report",r.exploit||"Unknown")+stat("CVSS",r.cvss||"Not provided")+stat("Patch availability",r.patchAvailable||"Unknown")+"</div><div class='cols'><div>"+section("What is the security impact?","The report identifies this finding, but does not by itself prove exploitability in your environment. Open the CVE and vendor references below for technical impact, prerequisites, vulnerable versions, attack vector, and mitigations.")+section("What happens if we do not patch?","Potential exposure continues only for devices with affected versions and relevant configurations. Evaluate vendor severity, exploitation evidence, asset exposure, compensating controls and business criticality before selecting a priority.")+section("What may be affected if we install it?","Verify official known issues, required restarts, dependencies, driver/application compatibility, database and SAP integration, service downtime, and rollback readiness. These effects are not confirmed for this individual patch without vendor release notes.")+"</div><div>"+section("Recommended deployment checks","1. Verify CVE/KB and affected product version. 2. Review official advisory and release notes. 3. Confirm the devices in scope. 4. Pilot on test systems. 5. Back up or prepare rollback. 6. Deploy gradually and verify services and patch status.")+section("Operational metadata","Source: "+(r.source||"Unknown")+" · Sheet: "+(r.sheet||"Unknown")+" · Row: "+(r.row||"Unknown")+" · Owner: "+(r.owner||"Unassigned")+" · Status: "+(r.status||"New"))+"</div></div><div class='card resources'><h2>Relevant research and official references</h2><p class='small'>These are direct source/search links relevant to this record. The portal does not fetch or verify live advisory content. Each link opens a new tab for technical review.</p>"+links.map(([name,url,desc])=>"<a href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+esc(name)+" ↗<div class='small'>"+esc(desc)+"</div></a>").join("")+"</div><div class='note'>Assessment status: research links available, but vulnerability impact and patch side effects have not been independently verified. Do not treat generalized guidance as a confirmed finding.</div><a class='btn' href='./index.html'>← Return to all patches</a>"
})();
</script></body></html>
