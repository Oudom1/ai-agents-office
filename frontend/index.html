<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Agents Office</title><style>.agent.state-working .bubble{display:none!important}.office-nav-links{position:fixed;top:14px;right:190px;z-index:9999;display:flex;gap:8px}.office-nav-links a{font:800 10px Inter,system-ui,sans-serif;text-decoration:none;color:#d8f3ff;background:#0d2332;border:1px solid #28536c;border-radius:999px;padding:7px 10px;box-shadow:0 8px 18px rgba(0,0,0,.2)}.office-nav-links a:hover{border-color:#56d8e7;color:#fff}@media(max-width:800px){.office-nav-links{position:static;padding:8px 12px;background:#071421;justify-content:flex-end;flex-wrap:wrap}}.office-task-board-overlay{position:absolute;z-index:3;overflow:auto;font:700 8px/1.3 Inter,system-ui,sans-serif;color:#d8f3ff;scrollbar-width:thin}.office-task-board-overlay .board-item{padding:4px 5px;margin-bottom:4px;border:1px solid #36506a;border-radius:5px;background:#102030dd}.office-task-board-overlay .board-name{color:#6fffd2}.office-task-board-overlay .board-state{color:#9ab2c8;font-size:7px;margin-top:2px}.office-task-board-overlay.empty{color:#7890a7;font-weight:600}</style></head><body><div class="office-nav-links"><a href="./portfolio/">Portfolio</a><a href="./health-monitoring.html">Health Monitor</a><a href="./create-user.html">Create User</a></div><div id="root"></div><script src="./api-timeout-guard.js?v=20261005-1"></script><script src="./security-gate.js?v=20261003-2"></script><script type="module" src="/src/main.tsx"></script><script src="/alex-kai.js"></script><script>(()=>{const K='ai-agents-office-tasks-v3';function add(){const p=document.querySelector('.manager-control');if(!p||document.getElementById('clear-all-tasks-btn'))return;const b=document.createElement('button');b.id='clear-all-tasks-btn';b.className='secondary';b.textContent='Clear Tasks';b.title='Clear all previous and active dashboard tasks/blockers';Object.assign(b.style,{display:'block',width:'100%',marginTop:'8px',borderColor:'#8f3d4b',color:'#ffc1c8',background:'#2c1720',fontWeight:'800'});b.onclick=()=>{localStorage.removeItem(K);location.reload()};p.appendChild(b)}new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true});add()})();</script><script>(()=>{const K='ai-agents-office-tasks-v3';const names={manager:'Alex',sysadmin:'Sam',security:'Mina',cloud:'Noah',qa:'Lina',implement:'Kai',developer:'Leo'};function readTasks(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function ensureBox(id,left){const office=document.querySelector('.office');if(!office)return null;let box=document.getElementById(id);if(!box){box=document.createElement('div');box.id=id;box.className='office-task-board-overlay';Object.assign(box.style,{left,top:'9%',width:'20%',height:'16%'});office.appendChild(box)}return box}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function item(t,state){const who=names[t.agentId]||t.agentId||'Agent';return `<div class="board-item"><div><span class="board-name">${esc(who)}</span> — ${esc(t.title)}</div><div class="board-state">${state}</div></div>`}function render(){const all=readTasks().filter(t=>String(t.status||'').toLowerCase()!=='done');const byAgent={};for(const t of all){(byAgent[t.agentId]??=[]).push(t)}Object.values(byAgent).forEach(list=>list.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)));const active=[];const queued=[];for(const [agentId,list] of Object.entries(byAgent)){if(!list.length)continue;const explicit=list.find(t=>['working','preparing','assigned-task','generating','starting','free-check'].includes(String(t.phase||'').toLowerCase())&&!t.blocker);const current=explicit||list[0];active.push(current);for(const t of list){if(t!==current)queued.push(t)}}const taskBox=ensureBox('task-board-overlay','26%');const activeBox=ensureBox('active-task-overlay','50%');if(taskBox){taskBox.classList.toggle('empty',queued.length===0);taskBox.innerHTML=queued.length?queued.slice(0,8).map(t=>item(t,`Assigned to ${names[t.agentId]||t.agentId} • waiting pickup`)).join(''):'No queued tasks'}if(activeBox){activeBox.classList.toggle('empty',active.length===0);activeBox.innerHTML=active.length?active.slice(0,7).map(t=>item(t,t.blocker?'BLOCKED':`Picked up by ${names[t.agentId]||t.agentId}`)).join(''):'No active tasks'}}new MutationObserver(render).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener('storage',render);setInterval(render,1500);render()})();</script></body></html>
