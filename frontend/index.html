<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Agents Office</title><style>.agent.state-working .bubble{display:none!important}</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script src="/alex-kai.js"></script><script>(()=>{const K='ai-agents-office-tasks-v3';function add(){const p=document.querySelector('.manager-control');if(!p||document.getElementById('clear-all-tasks-btn'))return;const b=document.createElement('button');b.id='clear-all-tasks-btn';b.className='secondary';b.textContent='Clear Tasks';b.title='Clear all previous and active dashboard tasks/blockers';Object.assign(b.style,{display:'block',width:'100%',marginTop:'8px',borderColor:'#8f3d4b',color:'#ffc1c8',background:'#2c1720',fontWeight:'800'});b.onclick=()=>{localStorage.removeItem(K);location.reload()};p.appendChild(b)}new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true});add()})();</script></body></html>
