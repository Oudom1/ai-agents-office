<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI Agents Office</title>
  <style>
    html,body{min-height:100%;margin:0;background:#06111d;color:#e8f4fb}
    #session-check{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#10354b 0,#06111d 45%,#030911 100%);font-family:Inter,Segoe UI,Arial,sans-serif}
    #session-card{width:min(420px,90vw);background:#091827;border:1px solid #244761;border-radius:16px;padding:22px;box-shadow:0 28px 70px rgba(0,0,0,.5)}
    #session-title{font-weight:900;font-size:18px;margin-bottom:8px}
    #session-msg{font-size:11px;line-height:1.5;color:#9fc3d5}
    .agent.state-working .bubble{display:none!important}
  </style>
</head>
<body>
  <div id="session-check">
    <div id="session-card">
      <div id="session-title">AI Agents Office</div>
      <div id="session-msg">Verifying secure session…</div>
    </div>
  </div>
  <div id="root"></div>

  <script src="./api-timeout-guard.js?v=20261005-12"></script>
  <script type="module">
    (async()=>{
      const API='https://ai-agents-office-api.onrender.com/api';
      const TOKEN_KEY='ai-office-auth-token-v1';
      const token=sessionStorage.getItem(TOKEN_KEY)||'';
      const msg=document.getElementById('session-msg');
      const goToLogin=()=>location.replace('./login-diagnostic.html');

      if(!token){
        goToLogin();
        return;
      }

      try {
        const r=await fetch(`${API}/auth/status`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
        if(!r.ok) throw new Error('Session expired');
        msg.textContent='Session verified. Opening office…';
        await import('/src/main.tsx');
        document.getElementById('session-check')?.remove();

        const addScript=(src)=>{
          const s=document.createElement('script');
          s.src=src;
          document.body.appendChild(s);
        };
        addScript('./alex-kai.js?v=20261005-4');
        addScript('./result-duration.js?v=20261005-1');
        addScript('./snack-lounge.js?v=20261005-2');
      } catch(e) {
        sessionStorage.removeItem(TOKEN_KEY);
        msg.textContent='Session unavailable. Opening secure login…';
        setTimeout(goToLogin,250);
      }
    })();
  </script>
</body>
</html>
