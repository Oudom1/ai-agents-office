<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agents Office</title>
  <style>
    html,body{min-height:100%;margin:0;background:#06111d;color:#e8f4fb}
    .agent.state-working .bubble{display:none!important}
    .office-nav-links{position:fixed;top:14px;right:190px;z-index:9999;display:flex;gap:8px}
    .office-nav-links a{font:800 10px Inter,system-ui,sans-serif;text-decoration:none;color:#d8f3ff;background:#0d2332;border:1px solid #28536c;border-radius:999px;padding:7px 10px;box-shadow:0 8px 18px rgba(0,0,0,.2)}
    .office-nav-links a:hover{border-color:#56d8e7;color:#fff}
    #boot-status{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#10354b 0,#06111d 45%,#030911 100%);font-family:Inter,Segoe UI,Arial,sans-serif}
    #boot-card{width:min(420px,90vw);background:#091827;border:1px solid #244761;border-radius:16px;padding:22px;box-shadow:0 28px 70px rgba(0,0,0,.5)}
    #boot-title{font-weight:900;font-size:18px;margin-bottom:8px}
    #boot-msg{font-size:11px;line-height:1.5;color:#9fc3d5}
    #boot-reload{display:none;margin-top:14px;width:100%;padding:10px;border-radius:8px;border:1px solid #2b6d87;background:#123d55;color:#e9f8ff;font-weight:900;cursor:pointer}
    @media(max-width:800px){.office-nav-links{position:static;padding:8px 12px;background:#071421;justify-content:flex-end;flex-wrap:wrap}}
  </style>
</head>
<body>
  <div id="boot-status">
    <div id="boot-card">
      <div id="boot-title">AI Agents Office</div>
      <div id="boot-msg">Loading secure access…</div>
      <button id="boot-reload" onclick="location.reload()">Reload Application</button>
    </div>
  </div>
  <div class="office-nav-links">
    <a href="./portfolio/">Portfolio</a>
    <a href="./health-monitoring.html">Health Monitor</a>
    <a href="./create-user.html">Create User</a>
  </div>
  <div id="root"></div>
  <script>
    (()=>{
      const boot=()=>document.getElementById('boot-status');
      const msg=()=>document.getElementById('boot-msg');
      const reload=()=>document.getElementById('boot-reload');
      const hideIfReady=()=>{
        const gate=document.getElementById('ai-security-gate');
        const root=document.getElementById('root');
        if(gate || (root && root.childElementCount>0)) boot()?.remove();
      };
      window.addEventListener('error',()=>{if(msg()) msg().textContent='Frontend startup error detected. Retrying secure login…';});
      window.addEventListener('unhandledrejection',()=>{if(msg()) msg().textContent='A startup request failed. Retrying secure login…';});
      const timer=setInterval(()=>{hideIfReady();if(!boot())clearInterval(timer)},250);
      setTimeout(()=>{
        if(!boot())return;
        if(msg())msg().textContent='Secure login is taking longer than expected. Retrying login module…';
        const s=document.createElement('script');
        s.src='./security-gate.js?v=20261005-8';
        s.onload=()=>setTimeout(hideIfReady,100);
        s.onerror=()=>{if(msg())msg().textContent='Login module could not be loaded. Please reload the application.';if(reload())reload().style.display='block'};
        document.head.appendChild(s);
      },2500);
      setTimeout(()=>{
        if(!boot())return;
        if(msg())msg().textContent='The application did not finish starting. Please reload once. If it remains here, the frontend is failing before it reaches the API.';
        if(reload())reload().style.display='block';
      },7000);
    })();
  </script>
  <script src="./api-timeout-guard.js?v=20261005-8"></script>
  <script src="./security-gate.js?v=20261005-8"></script>
  <script type="module" src="/src/main.tsx"></script>
  <script src="/alex-kai.js?v=20261005-4"></script>
  <script src="./result-duration.js?v=20261005-1"></script>
</body>
</html>
