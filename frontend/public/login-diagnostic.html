<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Office Login Diagnostic</title><style>body{font-family:Arial,sans-serif;background:#07121d;color:#e8f4fb;margin:0;padding:24px}.card{max-width:720px;margin:auto;background:#0b1b2a;border:1px solid #294b62;border-radius:14px;padding:20px}.ok{color:#7ee2a8}.bad{color:#ff9ea8}.muted{color:#91adbe}button{padding:10px 14px;border-radius:8px;border:1px solid #3d6f8a;background:#123b52;color:#fff;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#06101a;border-radius:8px;padding:12px}</style></head>
<body><div class="card"><h2>AI Agents Office Login Diagnostic</h2><p class="muted">This page tests your browser path to the backend without using your password.</p><button id="run">Run Verification</button><pre id="out">Ready.</pre><p><a style="color:#8fd9ff" href="./">Back to Login</a></p></div><script>
const API='https://ai-agents-office-api.onrender.com/api';
const out=document.getElementById('out');
async function test(){
  const lines=[]; const add=(s)=>{lines.push(s);out.textContent=lines.join('\n')};
  try{add('1) Testing backend health...');const r=await fetch(API+'/health',{cache:'no-store'});const j=await r.json();add(r.ok&&j.ok?'PASS: backend health reachable':'FAIL: backend health returned '+r.status);}catch(e){add('FAIL: backend health error: '+e.message);return}
  try{add('2) Testing secure handshake...');const r=await fetch(API+'/auth/handshake',{method:'POST',cache:'no-store'});const j=await r.json();add(r.ok&&j.handshakeId&&j.serverPublicKey?'PASS: secure handshake reachable':'FAIL: handshake returned '+r.status+' '+(j.error||''));}catch(e){add('FAIL: handshake error: '+e.message);return}
  try{add('3) Testing Web Crypto...');if(!window.crypto?.subtle)throw new Error('Web Crypto unavailable');await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);add('PASS: browser supports ECDH P-256');}catch(e){add('FAIL: browser crypto error: '+e.message);return}
  add('RESULT: Browser transport is healthy. If login still fails, the remaining issue is credential/session handling.');
}
document.getElementById('run').onclick=test;test();
</script></body></html>
