name: Lina Create User QA
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  live-ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        run: sleep 45
      - name: Test live Create User page
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            await page.goto('https://oudom1.github.io/ai-agents-office/create-user.html?v=linaqa', {waitUntil:'networkidle', timeout:120000});
            const button = page.locator('#create');
            if (await button.count() !== 1) throw new Error('Create button not found');
            if (await button.isDisabled()) throw new Error('Create button is disabled on live page');
            const pe = await button.evaluate(el => getComputedStyle(el).pointerEvents);
            if (pe === 'none') throw new Error('Create button pointer-events is none');
            await page.locator('#first').fill('Lina');
            await page.locator('#last').fill('QA');
            await page.locator('#password').fill('weak');
            await page.locator('#confirm').fill('weak');
            await page.locator('#adminPassword').fill('dummy');
            await button.click();
            await page.waitForTimeout(300);
            const msg = await page.locator('#msg').innerText();
            if (!msg.includes('15-character complexity policy')) throw new Error('Click handler did not run. Message: '+msg);
            console.log('LINA_QA_PASS: live button enabled and click handler works');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
