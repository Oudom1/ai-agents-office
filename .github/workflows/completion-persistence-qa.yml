name: Completion Persistence QA
on:
  push:
    branches: [fix/persist-task-completion-v34]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w frontend
      - name: Verify completion persistence wiring
        run: |
          grep -q 'encodeURIComponent(task.id)}/done' frontend/src/main.tsx
          grep -q 'locallyDone=new Map' frontend/src/main.tsx
