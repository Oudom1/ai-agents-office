name: Fix backend async auth handler

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-api-async.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix async auth login handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/src/index.ts')
          s=p.read_text()
          old="app.post('/api/auth/login',(req,res)=>{"
          new="app.post('/api/auth/login',async(req,res)=>{"
          if old not in s:
              raise SystemExit('auth login handler already fixed or anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-api-async.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts .github/workflows/fix-api-async.yml
          git commit -m "Fix async database-backed login handler"
          git push
