name: Smooth Kai State

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Kai stale waiting state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/main.tsx')
          s=p.read_text()
          s=s.replace("const KAI_PROVIDER_PENDING = 'Free video router: Hugging Face ZeroGPU LTX Video Fast → PixVerse Free/manual → Runway Free/manual. FREE ONLY; no paid fallback.';", "const KAI_PROVIDER_PENDING = 'No active provider job. Start or retry Kai to use Hugging Face ZeroGPU LTX Video Fast.';")
          old="""function normalizeKaiTask(t: Task): Task {\n  if (t.agentId !== 'implement') return t;\n  const hasRealProviderState = Boolean(t.providerJobId) || ['starting','generating','completed','provider-error'].includes(String(t.phase || '')) || t.provider === 'Hugging Face ZeroGPU LTX Video Fast';\n  if (hasRealProviderState) return {...t, freeOnly: true};\n  return {...t, provider: t.provider || 'Free Video Router', freeOnly: true, phase: t.phase || 'queued'};\n}\n"""
          new="""function normalizeKaiTask(t: Task): Task {\n  if (t.agentId !== 'implement') return t;\n  const phase=String(t.phase || '');\n  const hasRealProviderState = Boolean(t.providerJobId) || ['starting','generating','completed','provider-error'].includes(phase) || t.provider === 'Hugging Face ZeroGPU LTX Video Fast';\n  if (hasRealProviderState) return {...t, freeOnly: true};\n  return {...t, provider:'Hugging Face ZeroGPU LTX Video Fast', freeOnly:true, phase:'provider-error', blocker:t.blocker || 'Legacy Free Video Router task detected. It is not actively generating. Retry Kai to start LTX.', resultMessage:t.resultMessage || 'Waiting stopped — no provider job was started for this old task.'};\n}\n"""
          if old in s: s=s.replace(old,new)
          s=s.replace("provider: isKai ? 'Free Video Router' : isLeo ? 'Developer Workspace' : 'Internal Demo',", "provider: isKai ? 'Hugging Face ZeroGPU LTX Video Fast' : isLeo ? 'Developer Workspace' : 'Internal Demo',")
          s=s.replace("id, agentId, title, status: 'active', phase: kaiBlocked ? 'free-check' : 'queued', createdAt: new Date().toISOString(),", "id, agentId, title, status: 'active', phase: isKai ? 'provider-error' : (kaiBlocked ? 'free-check' : 'queued'), createdAt: new Date().toISOString(),")
          s=s.replace("blocker: undefined\n    };", "blocker: isKai ? 'Video backend request did not start. Retry Kai to start LTX.' : undefined,\n      resultMessage: isKai ? 'No active provider job. Retry generation.' : undefined\n    };")
          s=s.replace("patchTask(task.id, {status: 'active', phase: task.providerJobId ? 'generating' : 'queued', blocker: undefined, completedAt: undefined, resultMessage: task.providerJobId ? 'Leonardo is still generating the real MP4...' : KAI_PROVIDER_PENDING, nextRunAt: undefined});", "patchTask(task.id, {status:'active',phase:task.providerJobId ? 'generating' : 'provider-error',blocker:task.providerJobId ? undefined : 'No active provider job. Retry Kai to start LTX.',completedAt:undefined,resultMessage:task.providerJobId ? 'Hugging Face ZeroGPU LTX Video Fast is generating the real MP4...' : KAI_PROVIDER_PENDING,nextRunAt:undefined});")
          s=s.replace("setNotice(task.providerJobId ? 'Kai is still generating the real MP4.' : 'Kai task is waiting for a real free video provider — no fake completion.');", "setNotice(task.providerJobId ? 'Kai is still generating the real MP4.' : 'Kai is not generating. Retry the task to start LTX.');")
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build -w frontend
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Stop stale Kai free-router loading state"
          git push
