name: Show Kai Errors on Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch dashboard and backend error state
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: persist provider error as blocker and clear it on success.
          p=Path('api/src/index.ts')
          s=p.read_text()
          old="if(task){task.status='done';(task as any).phase='completed';(task as any).provider='Hugging Face ZeroGPU LTX Video Fast';(task as any).driveUrl=videoUrl;(task as any).resultMessage='Complete — real MP4 generated by Hugging Face ZeroGPU LTX Video Fast';task.completedAt=new Date().toISOString();}"
          new="if(task){task.status='done';(task as any).phase='completed';(task as any).provider='Hugging Face ZeroGPU LTX Video Fast';(task as any).driveUrl=videoUrl;(task as any).resultMessage='Complete — real MP4 generated by Hugging Face ZeroGPU LTX Video Fast';delete (task as any).blocker;task.completedAt=new Date().toISOString();}"
          if old in s: s=s.replace(old,new)
          old2="if(task){(task as any).phase='provider-error';(task as any).provider='Hugging Face ZeroGPU LTX Video Fast';(task as any).resultMessage=`ZeroGPU unavailable: ${job.error}`;}"
          new2="if(task){(task as any).phase='provider-error';(task as any).provider='Hugging Face ZeroGPU LTX Video Fast';(task as any).resultMessage=`ZeroGPU unavailable: ${job.error}`;(task as any).blocker=`Kai video provider error: ${job.error}`;}"
          if old2 in s: s=s.replace(old2,new2)
          p.write_text(s)

          # Frontend: persistent Kai status/problem on dashboard and Kai Studio.
          f=Path('frontend/src/main.tsx')
          x=f.read_text()
          needle="  const blockers = activeTasks.filter(t => t.blocker);\n\n  const selectedPlaceholder"
          insert="  const blockers = activeTasks.filter(t => t.blocker);\n  const kaiLatestTask = tasks.find(t => t.agentId === 'implement');\n  const kaiProblem = kaiLatestTask && (kaiLatestTask.phase === 'provider-error' || kaiLatestTask.blocker)\n    ? (kaiLatestTask.blocker || kaiLatestTask.resultMessage || 'Kai video provider error')\n    : '';\n  const kaiStatusText = kaiLatestTask\n    ? (kaiLatestTask.resultMessage || `Kai status: ${kaiLatestTask.phase || kaiLatestTask.status}`)\n    : 'Kai has no video task yet.';\n\n  const selectedPlaceholder"
          if needle in x: x=x.replace(needle,insert)

          needle2="<div className=\"header-actions\"><div className=\"status\"><span className=\"dot\" /> SYSTEM ONLINE</div>{notice && <div className=\"toast\">{notice}</div>}</div>"
          repl2="<div className=\"header-actions\"><div className=\"status\"><span className=\"dot\" /> SYSTEM ONLINE</div>{kaiProblem && <div className=\"toast\" style={{background:'#4b1020',border:'1px solid #ff4772',color:'#ffd8e1',maxWidth:'560px'}}>⚠ Kai: {kaiProblem}</div>}{notice && <div className=\"toast\">{notice}</div>}</div>"
          if needle2 in x: x=x.replace(needle2,repl2)

          old_panel="{selected === 'implement' && <div className=\"panel kai-panel\"><div className=\"kai-title\"><h2>Kai Video Studio</h2><span>FREE-ONLY</span></div><p className=\"kai-note\">"
          new_panel="{selected === 'implement' && <div className=\"panel kai-panel\"><div className=\"kai-title\"><h2>Kai Video Studio</h2><span>FREE-ONLY</span></div><div style={{margin:'10px 0',padding:'10px 12px',borderRadius:'8px',border:`1px solid ${kaiProblem ? '#ff4772' : '#2b506b'}`,background:kaiProblem ? '#35121dcc' : '#102536cc',color:kaiProblem ? '#ffd8e1' : '#bfe9ff',fontSize:'12px',lineHeight:1.45}}><b>{kaiProblem ? '⚠ KAI ERROR' : 'KAI LIVE STATUS'}</b><div style={{marginTop:'5px'}}>{kaiProblem || kaiStatusText}</div></div><p className=\"kai-note\">"
          if old_panel in x: x=x.replace(old_panel,new_panel)

          # Frontend immediate failure message should also set blocker locally.
          old_fail="if(result.status==='failed'){window.clearInterval(timer);await refresh();setNotice('Kai video generation failed. No paid fallback was used.');return;}"
          new_fail="if(result.status==='failed'){window.clearInterval(timer);patchTask(task.id,{phase:'provider-error',blocker:`Kai video provider error: ${result.error || 'generation failed'}`,resultMessage:`Kai video provider error: ${result.error || 'generation failed'}`});await refresh();setNotice('Kai video generation failed. Error is displayed on the dashboard.');return;}"
          if old_fail in x: x=x.replace(old_fail,new_fail)
          f.write_text(x)
          PY
      - name: Build
        run: |
          npm install
          npm run build -w api
          npm run build -w frontend
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show Kai provider errors persistently on dashboard"
          git push
