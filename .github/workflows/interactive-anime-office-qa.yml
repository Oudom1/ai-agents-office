name: Interactive Anime Office QA
on:
  push:
    branches: [fix/live-office-anime-portraits-v31]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w frontend
      - name: Check portrait image availability
        run: |
          curl -fL --retry 3 --max-time 25 -o /tmp/anime-office.png "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/7e266aaa058d7d314d5382cbdae610e5e0c81063e94ac5fca041903fec9509eb.png"
          file /tmp/anime-office.png | grep -q 'PNG image data'
