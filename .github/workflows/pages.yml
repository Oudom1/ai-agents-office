name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare individual agent portraits
        run: |
          python -m pip install --quiet pillow
          python frontend/scripts/prepare_portraits.py
      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: https://ai-agents-office-api-v2.onrender.com
      - name: Verify patch portal included in Pages build
        run: |
          mkdir -p frontend/dist/patch-analysis
          cp patch-analysis/index.html frontend/dist/patch-analysis/index.html
          test -s frontend/dist/patch-analysis/index.html
          test -s frontend/dist/patch-analysis/detail.html
          test -s frontend/dist/patch-analysis/intelligence.html
          grep -q "CVE updates" frontend/dist/patch-analysis/intelligence.html
          echo "Patch portal, dedicated details and CVE intelligence are included in deployment artifact"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
