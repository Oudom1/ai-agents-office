name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare individual agent portraits
        run: |
          python -m pip install --quiet pillow
          python frontend/scripts/prepare_portraits.py
      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: https://ai-agents-office-api-v2.onrender.com
      - name: Include patch review pages
        run: |
          mkdir -p frontend/dist/patch-analysis
          cp patch-analysis/index.html patch-analysis/detail.html patch-analysis/intelligence.html frontend/dist/patch-analysis/
          test -s frontend/dist/patch-analysis/index.html
          test -s frontend/dist/patch-analysis/detail.html
          test -s frontend/dist/patch-analysis/intelligence.html
          grep -q "CVE updates" frontend/dist/patch-analysis/intelligence.html
      - name: Fetch official Microsoft security KB updates
        run: python patch-analysis/scripts/fetch_msrc_kb.py
      - name: Verify Microsoft KB feed artifact
        run: |
          test -s frontend/dist/patch-analysis/microsoft-kb-updates.json
          python -m json.tool frontend/dist/patch-analysis/microsoft-kb-updates.json > /dev/null
          echo "KB feed generated; frontend reports source status even when MSRC is unavailable"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
