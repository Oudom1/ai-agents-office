name: Assign Lina Typing Tool QA abilities

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Lina QA abilities
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = "qa: ['Q/A', 'Testing', 'Validation', 'UAT', 'Quality Review'],"
          new = "qa: ['Q/A', 'Testing', 'Validation', 'UAT', 'Quality Review', 'Typing Tool QA', 'API Testing', 'Regression Testing', 'Responsive Testing'],"
          if old in s:
              s = s.replace(old, new)
          elif 'Typing Tool QA' not in s:
              raise SystemExit('QA skills line not found')
          p.write_text(s)
          PY
      - name: Commit Lina QA abilities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Typing Tool QA abilities to Lina"
          git push
