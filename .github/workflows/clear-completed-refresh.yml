name: Completed results refresh regression
on:
  push:
    branches: [fix/clear-completed-refresh-race]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w frontend
      - run: grep -q 'markCleared(completed.map' frontend/src/main.tsx
