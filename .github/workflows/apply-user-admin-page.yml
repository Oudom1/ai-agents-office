name: Apply User Admin Page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch_user_admin_page.py
      - run: cd api && npm install && npm run build
      - run: cd frontend && npm install && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts frontend/index.html frontend/public/create-user.html
          git commit -m "Add admin-verified user creation page and multi-user login"
          git push
