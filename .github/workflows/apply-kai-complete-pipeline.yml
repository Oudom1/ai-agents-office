name: Apply Kai Complete Pipeline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch_kai_complete_pipeline.py
      - run: npm install
      - run: npm run build -w api
      - run: npm run build -w frontend
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts api/package.json package-lock.json frontend/src/main.tsx
          git commit -m "Complete Kai video pipeline with scene merge and real Drive upload support"
          git push
