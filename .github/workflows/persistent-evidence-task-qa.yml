name: Persistent Evidence Task QA
on:
  push:
    branches: [feature/persistent-evidence-tasks-v39]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w api
      - run: npm run build -w frontend
      - name: Verify evidence guard and persistence
        run: |
          grep -q 'initializeTaskHistory(tasks)' api/src/index.ts
          grep -q 'Completion requires an evidenceUrl' api/src/index.ts
