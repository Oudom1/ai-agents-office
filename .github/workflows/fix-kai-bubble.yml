name: Fix Kai Bubble State

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove stale free-router messages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/main.tsx')
          s=p.read_text()
          s=s.replace("'Free router waiting for provider…'", "'Ready to start LTX video generation.'")
          s=s.replace("'Provider Pending'", "'Retry Required'")
          s=s.replace("'Free router waiting for provider integration'", "'Provider error — check dashboard'")
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build -w frontend
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale Kai free-router bubble text"
          git push
