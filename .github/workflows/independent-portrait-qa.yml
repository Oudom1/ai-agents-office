name: Independent Portrait QA
on:
  push:
    branches: [feature/seven-individual-portrait-assets-v33]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --quiet pillow
      - run: python frontend/scripts/prepare_portraits.py
      - run: test "$(find frontend/public/portraits -name '*.webp' | wc -l)" -eq 7
      - run: npm run build -w frontend
      - run: test "$(find frontend/dist/portraits -name '*.webp' | wc -l)" -eq 7
