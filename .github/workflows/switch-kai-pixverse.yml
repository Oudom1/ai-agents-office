name: Switch Kai to PixVerse Free

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-kai-pixverse.yml'

permissions:
  contents: write

jobs:
  switch-kai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Kai free provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          s = s.replace("const KAI_FREE_VIDEO_AVAILABLE = false;", "const KAI_FREE_VIDEO_AVAILABLE = true;")
          s = s.replace("const KAI_PROVIDER_BLOCKER = 'HeyGen Free blocked: Avatar IV monthly limit reached. FREE ONLY is enabled, so no paid fallback will be used.';", "const KAI_PROVIDER_BLOCKER = 'PixVerse Free is selected. FREE ONLY is enabled; no paid fallback will be used.';")
          s = s.replace("'HeyGen'", "'PixVerse Free'")
          s = s.replace("'HeyGen Free'", "'PixVerse Free'")
          s = s.replace("/video|cartoon|comedy|heygen|reel|short|promo/", "/video|cartoon|comedy|heygen|pixverse|reel|short|promo/")
          s = s.replace("durationSec: kaiBlocked ? undefined : isKai ? 24 : isLeo ? 45 : 12,", "durationSec: isKai ? undefined : isLeo ? 45 : 12,")
          s = s.replace("function loadLocalTasks(): Task[] {\n  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }\n  catch { return []; }\n}", "function loadLocalTasks(): Task[] {\n  try {\n    const parsed: Task[] = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');\n    return parsed.map(t => t.agentId === 'implement' ? {...t, provider: 'PixVerse Free', blocker: undefined, durationSec: undefined, phase: t.status === 'done' ? t.phase : 'queued'} : t);\n  } catch { return []; }\n}")

          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/switch-kai-pixverse.yml
      - name: Commit Kai provider switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/switch-kai-pixverse.yml
          git commit -m "Switch Kai from HeyGen to PixVerse Free"
          git push
