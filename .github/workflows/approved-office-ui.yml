name: Approved office UI build
on:
  push:
    branches: [fix/approved-office-layout]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w frontend
      - name: Layout checks
        run: |
          grep -q 'office-agent-grid' frontend/src/main.tsx
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' frontend/src/styles.css
