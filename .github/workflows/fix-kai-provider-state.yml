name: Fix Kai provider task state

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Kai provider state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          s = s.replace("  blocker?: string;\n};", "  blocker?: string;\n  providerJobId?: string;\n};")

          old = """function loadLocalTasks(): Task[] {\n  try {\n    const parsed: Task[] = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');\n    return parsed.map(t => t.agentId === 'implement' ? {...t, provider: 'Free Video Router', blocker: undefined, durationSec: undefined, phase: t.status === 'done' ? t.phase : 'queued'} : t);\n  } catch { return []; }\n}\n"""
          new = """function normalizeKaiTask(t: Task): Task {\n  if (t.agentId !== 'implement') return t;\n  const hasRealProviderState = Boolean(t.providerJobId) || ['starting','generating','completed','provider-error'].includes(String(t.phase || '')) || t.provider === 'Leonardo Free Trial';\n  if (hasRealProviderState) return {...t, freeOnly: true};\n  return {...t, provider: t.provider || 'Free Video Router', freeOnly: true, phase: t.phase || 'queued'};\n}\n\nfunction loadLocalTasks(): Task[] {\n  try {\n    const parsed: Task[] = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');\n    return parsed.map(normalizeKaiTask);\n  } catch { return []; }\n}\n"""
          if old not in s:
              raise SystemExit('loadLocalTasks block not found')
          s = s.replace(old, new)

          old = "if (Array.isArray(data) && data.length) setTasks(data.map((t: Task) => t.agentId === 'implement' ? {...t, provider: 'Free Video Router', blocker: undefined, phase: t.status === 'done' ? t.phase : 'queued'} : t));"
          new = "if (Array.isArray(data)) setTasks(data.map((t: Task) => normalizeKaiTask(t)));"
          if old not in s:
              raise SystemExit('refresh task mapping not found')
          s = s.replace(old, new)

          old = """      const task = await create.json();\n      const start = await authFetch(`${API}/video/generate`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId:task.id,prompt:title})});"""
          new = """      const task = await create.json();\n      setTasks(prev => [normalizeKaiTask({...task, provider:'Leonardo Free Trial', phase:'starting', resultMessage:'Connecting to Leonardo Free Trial API...'}), ...prev.filter(t => t.id !== task.id)]);\n      const start = await authFetch(`${API}/video/generate`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId:task.id,prompt:title})});"""
          if old not in s:
              raise SystemExit('startKaiProviderTask create block not found')
          s = s.replace(old, new)

          old = """            if(result.status==='failed'){window.clearInterval(timer);await refresh();setNotice('Kai video generation failed. No paid fallback was used.');return;}\n          }"""
          new = """            if(result.status==='failed'){window.clearInterval(timer);await refresh();setNotice('Kai video generation failed. No paid fallback was used.');return;}\n            patchTask(task.id, {provider:'Leonardo Free Trial', providerJobId:generationId, phase:'generating', resultMessage:'Leonardo is generating the real MP4...'});\n          }"""
          if old not in s:
              raise SystemExit('polling block not found')
          s = s.replace(old, new)

          old = "patchTask(task.id, {status: 'active', phase: 'queued', blocker: undefined, completedAt: undefined, resultMessage: KAI_PROVIDER_PENDING, nextRunAt: undefined});"
          new = "patchTask(task.id, {status: 'active', phase: task.providerJobId ? 'generating' : 'queued', blocker: undefined, completedAt: undefined, resultMessage: task.providerJobId ? 'Leonardo is still generating the real MP4...' : KAI_PROVIDER_PENDING, nextRunAt: undefined});"
          if old not in s:
              raise SystemExit('completeTask Kai wait block not found')
          s = s.replace(old, new)

          old = "setNotice('Kai task is waiting for real free video provider integration — no fake completion.');"
          new = "setNotice(task.providerJobId ? 'Kai is still generating the real MP4.' : 'Kai task is waiting for a real free video provider — no fake completion.');"
          s = s.replace(old, new)

          old = """<div className=\"task-timer\"><div className=\"timer-bar\"><i style={{width: `${task.blocker ? 8 : progress}%`}} /></div><div className=\"timer-line\"><span>{task.blocker ? 'Blocked — waiting for Alex…' : isKai ? 'Free router waiting for provider integration…' : task.phase === 'working' ? (isLeo ? 'Coding…' : 'Generating…') : task.phase === 'preparing' ? 'Preparing…' : 'Loading…'}</span><b>{task.blocker ? 'BLOCKED' : isKai ? 'READY' : task.phase === 'working' ? `${formatDuration(remaining)} left` : 'In progress'}</b></div></div>"""
          new = """<div className=\"task-timer\"><div className=\"timer-bar\"><i style={{width: `${task.blocker ? 8 : progress}%`}} /></div><div className=\"timer-line\"><span>{task.blocker ? 'Blocked — waiting for Alex…' : isKai ? (task.phase === 'starting' ? 'Connecting to Leonardo…' : task.phase === 'generating' ? 'Leonardo is generating the real MP4…' : task.phase === 'provider-error' ? 'Free provider returned an error.' : 'Free router waiting for provider…') : task.phase === 'working' ? (isLeo ? 'Coding…' : 'Generating…') : task.phase === 'preparing' ? 'Preparing…' : 'Loading…'}</span><b>{task.blocker ? 'BLOCKED' : isKai ? (task.phase === 'generating' ? 'GENERATING' : task.phase === 'starting' ? 'CONNECTING' : task.phase === 'provider-error' ? 'ERROR' : 'READY') : task.phase === 'working' ? `${formatDuration(remaining)} left` : 'In progress'}</b></div></div>"""
          if old not in s:
              raise SystemExit('ActiveTaskCard timer block not found')
          s = s.replace(old, new)

          old = "{task.blocker ? '✓ Clear Blocker' : isKai ? 'Provider Pending' : '⚠ Raise Blocker'}"
          new = "{task.blocker ? '✓ Clear Blocker' : isKai ? (task.phase === 'generating' ? 'Generating…' : task.phase === 'starting' ? 'Connecting…' : task.phase === 'provider-error' ? 'Provider Error' : 'Provider Pending') : '⚠ Raise Blocker'}"
          if old not in s:
              raise SystemExit('Kai button label not found')
          s = s.replace(old, new)

          old = "function friendlyPhase(phase?: string) { if (phase === 'free-check') return 'Free Check'; if (phase === 'received') return 'Received'; if (phase === 'preparing') return 'Preparing'; if (phase === 'working') return 'Working'; if (phase === 'completed') return 'Completed'; return 'Queued'; }"
          new = "function friendlyPhase(phase?: string) { if (phase === 'starting') return 'Connecting'; if (phase === 'generating') return 'Generating'; if (phase === 'provider-error') return 'Provider Error'; if (phase === 'free-check') return 'Free Check'; if (phase === 'received') return 'Received'; if (phase === 'preparing') return 'Preparing'; if (phase === 'working') return 'Working'; if (phase === 'completed') return 'Completed'; return 'Queued'; }"
          if old not in s:
              raise SystemExit('friendlyPhase function not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Kai provider task lifecycle UI"
          git push
