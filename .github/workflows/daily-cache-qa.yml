name: Daily Safe Cache QA
on:
  push:
    branches: [feature/daily-safe-cache-clean-v35]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build -w frontend
      - name: Ensure task storage untouched
        run: |
          grep -q 'ai-office-temp-' frontend/src/main.tsx
          grep -q 'DAILY_CACHE_INTERVAL' frontend/src/main.tsx
