name: Fix Kai ready state

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Kai state and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/main.tsx')
          s=p.read_text()
          reps={
          "const KAI_PROVIDER_BLOCKER = 'PixVerse Free is selected. FREE ONLY is enabled; no paid fallback will be used.';":"const KAI_PROVIDER_PENDING = 'Waiting for real free video provider integration. FREE ONLY is enabled; no paid fallback will be used.';",
          "if (Array.isArray(data) && data.length) setTasks(data);":"if (Array.isArray(data) && data.length) setTasks(data.map((t: Task) => t.agentId === 'implement' ? {...t, provider: 'PixVerse Free', blocker: undefined, phase: t.status === 'done' ? t.phase : 'queued'} : t));",
          "        blocker: KAI_PROVIDER_BLOCKER\n":"        blocker: undefined\n",
          "      patchTask(taskId, {phase: 'free-check', blocker: KAI_PROVIDER_BLOCKER, startedAt: undefined});":"      patchTask(taskId, {phase: 'queued', blocker: undefined, startedAt: undefined});",
          "      setNotice('Kai blocked — HeyGen Free Avatar IV monthly limit reached');":"      setNotice('Kai is ready. Real free video provider integration is still pending.');",
          "      : 'Alex prepared the brief, but Kai is blocked by the HeyGen Free monthly limit');":"      : 'Alex prepared the brief. Kai is waiting for a real free provider integration.');",
          "      patchTask(task.id, {status: 'active', phase: 'free-check', blocker: KAI_PROVIDER_BLOCKER, completedAt: undefined, resultMessage: undefined, nextRunAt: undefined});\n      updateLocal('implement', {state: 'blocked', currentTask: task.title, destination: {x: 85, y: 18}});\n      setNotice('Kai cannot complete — no real MP4 exists because HeyGen Free quota is blocked');":"      patchTask(task.id, {status: 'active', phase: 'queued', blocker: undefined, completedAt: undefined, resultMessage: KAI_PROVIDER_PENDING, nextRunAt: undefined});\n      updateLocal('implement', {state: 'working', currentTask: task.title});\n      setNotice('Kai task is waiting for real free video provider integration — no fake completion.');",
          "      patchTask(task.id, {blocker: KAI_PROVIDER_BLOCKER, phase: 'free-check'});\n      updateLocal(task.agentId, {state: 'blocked'});\n      setNotice('Kai blocker cannot be cleared until HeyGen Free quota becomes available');":"      patchTask(task.id, {blocker: undefined, phase: 'queued'});\n      updateLocal(task.agentId, {state: 'working'});\n      setNotice('Kai is ready; provider integration is pending, not quota-blocked.');",
          "<p className=\"kai-note\">Alex prepares comedy-cartoon video briefs for Kai. Current real provider state: HeyGen Free Avatar IV monthly limit reached, so Kai stays BLOCKED and no task is marked complete until a real MP4 exists.</p><div className=\"skill-tags\"><span>Comedy Cartoon</span><span>HeyGen Free</span><span>Google Drive</span><span>No Paid Fallback</span><span>Quota Blocked</span></div>":"<p className=\"kai-note\">Alex prepares comedy-cartoon video briefs for Kai. PixVerse Free is the selected UI route, but no real provider API is connected yet. Kai remains READY and tasks wait for provider integration. No task is marked complete until a real MP4 exists.</p><div className=\"skill-tags\"><span>Comedy Cartoon</span><span>PixVerse Free</span><span>Google Drive</span><span>No Paid Fallback</span><span>Provider Pending</span></div>",
          "{task.blocker ? 'Provider unavailable — waiting for free quota…' : task.phase === 'working' ? (isLeo ? 'Coding…' : 'Generating…') : task.phase === 'preparing' ? 'Preparing…' : 'Loading…'}":"{task.blocker ? 'Blocked — waiting for Alex…' : isKai ? 'Waiting for real free provider integration…' : task.phase === 'working' ? (isLeo ? 'Coding…' : 'Generating…') : task.phase === 'preparing' ? 'Preparing…' : 'Loading…'}",
          "{task.blocker ? 'BLOCKED' : task.phase === 'working' ? `${formatDuration(remaining)} left` : 'In progress'}":"{task.blocker ? 'BLOCKED' : isKai ? 'READY' : task.phase === 'working' ? `${formatDuration(remaining)} left` : 'In progress'}",
          "{task.blocker ? (isKai ? 'Quota Blocked' : '✓ Clear Blocker') : '⚠ Raise Blocker'}":"{task.blocker ? '✓ Clear Blocker' : isKai ? 'Provider Pending' : '⚠ Raise Blocker'}",
          "agent.id === 'implement' ? 'HeyGen Free quota blocked' : 'Blocked — need Alex'":"agent.id === 'implement' ? 'Waiting for free provider integration' : 'Blocked — need Alex'"
          }
          for old,new in reps.items():
              if old in s:
                  s=s.replace(old,new)
              else:
                  print('WARN missing:',old[:100])
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Kai stale blocked state and provider messaging"
          git push
