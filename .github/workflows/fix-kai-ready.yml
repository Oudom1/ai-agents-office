name: Integrate Kai real free video provider

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Kai Leonardo integration
        run: python scripts/integrate_kai_leonardo.py

      - name: Build frontend and API
        run: |
          npm install
          npm run build -w frontend
          npm run build -w api

      - name: Commit provider integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts frontend/src/main.tsx render.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Connect Kai to Leonardo free trial video API"
          git push
