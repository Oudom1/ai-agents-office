name: Add secure password reset integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reset patch
        run: python scripts/patch-reset.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-password-reset.yml scripts/patch-reset.py
          git add api/src/index.ts frontend/public/security-gate.js .github/workflows/add-password-reset.yml scripts/patch-reset.py
          git commit -m "Integrate secure Neon-backed password reset"
          git push
