name: Add secure password reset integration

on:
  push:
    branches: [main]
    paths: [.github/workflows/add-password-reset.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and login page
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('api/src/index.ts')
          s=p.read_text()
          s=s.replace("import { agents, tasks, managerPoint, loungePoint, cafeteriaPoint, startedAt } from './store.js';", "import { agents, tasks, managerPoint, loungePoint, cafeteriaPoint, startedAt } from './store.js';\nimport { databaseConfigured, strongPassword, verifyAdminPassword, resetAdminPassword, persistSecurityLog } from './auth-store.js';")
          s=s.replace("const ADMIN_PASSWORD = process.env.ADMIN_PASSWORD || '';", "const ADMIN_PASSWORD = process.env.ADMIN_PASSWORD || '';\nconst PASSWORD_RESET_KEY = process.env.PASSWORD_RESET_KEY || '';")
          s=s.replace("const loginAttempts = new Map<string,{count:number,windowStart:number}>();", "const loginAttempts = new Map<string,{count:number,windowStart:number}>();\nconst resetAttempts = new Map<string,{count:number,windowStart:number}>();")
          s=s.replace("  securityLogs.splice(MAX_SECURITY_LOGS);\n}", "  securityLogs.splice(MAX_SECURITY_LOGS);\n  void persistSecurityLog({result,username:user,detail,ip:req.ip || req.socket?.remoteAddress || 'unknown',userAgent:req.get?.('user-agent') || 'unknown'});\n}")
          s=s.replace("authConfigured:Boolean(ADMIN_PASSWORD),", "authConfigured:Boolean(ADMIN_PASSWORD) || databaseConfigured(),\n  databaseConfigured:databaseConfigured(),\n  passwordResetConfigured:Boolean(PASSWORD_RESET_KEY) && databaseConfigured(),")
          s=s.replace("if(!ADMIN_PASSWORD) return res.status(503).json({error:'Security backend is not configured'});", "if(!ADMIN_PASSWORD && !databaseConfigured()) return res.status(503).json({error:'Security backend is not configured'});", 2)
          old="""    const okUser=secureEqual(username,ADMIN_USERNAME);
    const okPass=secureEqual(password,ADMIN_PASSWORD);
    if(!okUser || !okPass){"""
          new="""    const okUser=secureEqual(username,ADMIN_USERNAME);
    const okPass=await verifyAdminPassword(username,password,ADMIN_USERNAME,ADMIN_PASSWORD);
    if(!okUser || !okPass){"""
          if old not in s:
              raise SystemExit('login verification anchor not found')
          s=s.replace(old,new,1)
          anchor="app.get('/api/auth/status',requireAuth,(req:any,res)=>res.json({ok:true,user:req.auth.user,expiresAt:new Date(req.auth.expiresAt).toISOString()}));"
          reset_route="""app.post('/api/auth/reset-password',async(req,res)=>{
  if(!PASSWORD_RESET_KEY || !databaseConfigured()) return res.status(503).json({error:'Password reset service is not configured'});
  const ip=req.ip || req.socket?.remoteAddress || 'unknown';
  const now=Date.now();
  const RESET_WINDOW_MS=15*60*1000;
  const MAX_RESET_ATTEMPTS=3;
  let attempt=resetAttempts.get(ip);
  if(!attempt || now-attempt.windowStart>=RESET_WINDOW_MS){attempt={count:0,windowStart:now};resetAttempts.set(ip,attempt);}
  if(attempt.count>=MAX_RESET_ATTEMPTS){
    const retryAfterSec=Math.ceil(Math.max(0,RESET_WINDOW_MS-(now-attempt.windowStart))/1000);
    res.setHeader('Retry-After',String(retryAfterSec));
    addSecurityLog(req,'BLOCKED','unknown','Too many password reset attempts');
    return res.status(429).json({error:'Too many reset attempts. Please wait before trying again.',retryAfterSec});
  }
  const username=String(req.body?.username||'').trim();
  const recoveryKey=String(req.body?.recoveryKey||'');
  const newPassword=String(req.body?.newPassword||'');
  if(!strongPassword(newPassword)) return res.status(400).json({error:'Password must be 15+ characters with uppercase, lowercase, number and special character.'});
  if(!secureEqual(username,ADMIN_USERNAME) || !secureEqual(recoveryKey,PASSWORD_RESET_KEY)){
    attempt.count+=1;
    addSecurityLog(req,'FAILED',username||'unknown','Invalid password recovery credentials');
    return res.status(401).json({error:'Invalid recovery credentials',attemptsRemaining:Math.max(0,MAX_RESET_ATTEMPTS-attempt.count)});
  }
  try{
    await resetAdminPassword(username,newPassword);
    sessions.clear();
    loginAttempts.clear();
    resetAttempts.delete(ip);
    addSecurityLog(req,'SUCCESS',username,'Admin password reset in Neon; active sessions revoked');
    return res.json({ok:true,message:'Password reset successful. Sign in with the new password.'});
  }catch(e){
    console.error('Password reset failed',e);
    addSecurityLog(req,'FAILED',username,'Password reset database error');
    return res.status(500).json({error:'Unable to update password'});
  }
});

"""+anchor
          if anchor not in s:
              raise SystemExit('status route anchor not found')
          s=s.replace(anchor,reset_route,1)
          p.write_text(s)

          g=Path('frontend/public/security-gate.js')
          t=g.read_text()
          button="<button id=\"ai-sec-enter\" style=\"width:100%;padding:10px;border-radius:8px;border:1px solid #2b6d87;background:#123d55;color:#e9f8ff;font-weight:900;cursor:pointer\">Secure Key Exchange & Unlock</button>"
          replacement=button+"<a href=\"./reset-password.html\" style=\"display:block;text-align:center;margin-top:10px;color:#8fd9ff;font-size:9px;text-decoration:none\">Forgot password? Reset securely</a>"
          if button not in t:
              raise SystemExit('login button anchor not found')
          g.write_text(t.replace(button,replacement,1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/add-password-reset.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/index.ts frontend/public/security-gate.js .github/workflows/add-password-reset.yml
          git commit -m "Integrate secure Neon-backed password reset"
          git push
